<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Lipat: a strip of paper folded once into an L. Vertical leg is the front face, the horizontal leg the folded-over face. -->
  <rect width="512" height="512" fill="#1f6b47"/>
  <g stroke-linejoin="round" stroke-width="10">
    <polygon points="156,392 244,304 356,304 356,392" fill="#d9d9d3" stroke="#d9d9d3"/>
    <polygon points="156,120 244,120 244,304 156,392" fill="#ffffff" stroke="#ffffff"/>
  </g>
  <line x1="156" y1="392" x2="244" y2="304" stroke="#1f6b47" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>
</svg>
